name: syntax-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  syntax:
    name: Check portable JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check scripts, adapters and tests
        run: |
          find portable portable-tests scripts -type f \( -name '*.cjs' -o -name '*.mjs' -o -name '*.js' \) -print0 | xargs -0 -n 1 node --check
